<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人主页</title>

  <style>
    :root{
      --accent: 200,200,255;        /* 主色 */
      --accent2: 180,220,255;       /* 辅色 */
      --text: #111;
      --text-soft: rgba(0,0,0,0.65);
      --text-strong: #000;                 /* 自动对比色 */
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif; }

    body {
      height:100vh; display:flex; justify-content:center; align-items:center;
      padding:60px;
      background-size:cover; background-position:center; overflow:hidden;
      animation:fadeIn 1.2s ease;
      perspective:1600px;
    }

    /* 多层空间光（双主题色） */
    body::before {
      content:""; position:absolute; inset:0;
      background:
        radial-gradient(circle at 20% 30%, rgba(var(--accent),0.35), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(var(--accent2),0.28), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(var(--accent),0.18), transparent 60%);
      filter: blur(110px);
      animation: float 28s ease-in-out infinite alternate;
    }

    body::after {
      content:""; position:absolute; inset:0;
      background-image:url('https://grainy-gradients.vercel.app/noise.svg');
      opacity:0.08;
    }

    @keyframes float {
      from { transform:translateY(-40px) scale(1); }
      to { transform:translateY(40px) scale(1.08); }
    }

    .overlay {
      position:absolute; inset:0;
      backdrop-filter:blur(90px) saturate(160%) brightness(1.08);
      background:rgba(255,255,255,0.16);
    }

    .container {
      position:relative; z-index:2;
      display:flex; flex-direction:column; align-items:center;
      gap:50px;
      padding:85px 100px;
      border-radius:48px;
      width:min(1060px, 92vw);
      min-height:500px;

      backdrop-filter:blur(90px) saturate(200%) brightness(1.1);
      background:linear-gradient(135deg, rgba(255,255,255,0.7), rgba(255,255,255,0.28));

      box-shadow:
        0 80px 200px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.9);

      border:1px solid rgba(255,255,255,0.8);
      transform-style:preserve-3d;
      transition:transform .18s ease-out;
      overflow:hidden;

      /* 整体缩小到85% */
      transform:scale(0.85);
    }

    /* 主高光（随鼠标） */
    .container::after{
      content:""; position:absolute; inset:0; border-radius:inherit;
      background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.55), transparent 40%);
      opacity:0.65; pointer-events:none;
    }

    /* 边缘色散（封神关键） */
    .container::before{
      content:""; position:absolute; inset:0; border-radius:inherit;
      background:linear-gradient(130deg,
        rgba(var(--accent),0.35),
        transparent 30%,
        transparent 70%,
        rgba(var(--accent2),0.35));
      mix-blend-mode:overlay;
      opacity:0.6;
      pointer-events:none;
    }

    .profile { display:flex; flex-direction:column; align-items:center; gap:24px; }

    .avatar {
      width:150px; height:150px; border-radius:50%; overflow:hidden;
      border:3px solid rgba(255,255,255,0.9);
      box-shadow:0 25px 60px rgba(0,0,0,0.22);
      transition:transform .4s ease;
    }

    .avatar:hover { transform:scale(1.06) translateZ(20px); }

    .avatar img { width:100%; height:100%; object-fit:cover; }

    .name {
      font-size:32px; font-weight:700;
      color:#111;
      letter-spacing:1px;
      text-shadow:none;
    }

    .links {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
      gap:22px;
      width:100%; max-width:950px;
    }

    .link-btn {
      display:flex; align-items:center; justify-content:center;
      text-decoration:none;
      padding:22px 28px;
      border-radius:26px;
      color:#111; /* 强制高对比 */
      font-size:17px; font-weight:700; letter-spacing:0.6px;

      /* 关键：去掉过度透明 */
      backdrop-filter:blur(20px) saturate(160%);
      background:rgba(255,255,255,0.96);

      box-shadow:
        0 20px 60px rgba(0,0,0,0.22);

      border:1px solid rgba(0,0,0,0.06);
      transition:all .25s ease;
      position:relative; overflow:hidden;

      /* 关键：强对比文本 */
      text-shadow:none;
      -webkit-text-stroke:0;
    }

    /* 液态扫光 */
    .link-btn::after {
      content:""; position:absolute; inset:0;
      background:linear-gradient(120deg,transparent,rgba(255,255,255,0.9),transparent);
      transform:translateX(-120%);
      transition:0.9s;
    }

    .link-btn:hover::after { transform:translateX(120%); }

    .link-btn:hover {
      transform:translateY(-6px);
      background:#ffffff;
      box-shadow:0 30px 80px rgba(0,0,0,0.25);
    }

    @keyframes fadeIn {
      from {opacity:0; transform:scale(.94);} to {opacity:1; transform:scale(1);} }

    @media (max-width:768px) {
      .container { padding:70px 40px; }
      .links { grid-template-columns:1fr 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation:none !important; transition:none !important; }
    
    /* 深色背景下按钮增强对比 */
    .dark-bg .link-btn{
      background:rgba(30,30,35,0.55);
      border:1px solid rgba(255,255,255,0.18);
      color:#ffffff;
      text-shadow:
        0 1px 3px rgba(0,0,0,0.8),
        0 0 2px rgba(0,0,0,0.6);
      -webkit-text-stroke:0.3px rgba(0,0,0,0.6);
    }

    .dark-bg .link-btn:hover{
      background:rgba(40,40,45,0.75);
    }

    /* 亮色背景下按钮 */
    .light-bg .link-btn{
      background:rgba(255,255,255,0.88);
      color:#000;
    }

  }
  </style>
</head>

<body>
  <div class="overlay"></div>

  <div class="container" id="card">
    <div class="profile">
      <div class="avatar">
        <img src="https://via.placeholder.com/150" alt="avatar">
      </div>
      <div class="name">你的昵称</div>
    </div>

    <div class="links">
      <a class="link-btn" href="#" target="_blank">链接一</a>
      <a class="link-btn" href="#" target="_blank">链接二</a>
      <a class="link-btn" href="#" target="_blank">链接三</a>
    </div>
  </div>

  <script>
    const card=document.getElementById('card');

    // 物理级动效系统（弹簧 + 速度 + 阻尼）
    let currentX = 0, currentY = 0;
    let velocityX = 0, velocityY = 0;
    let targetX = 0, targetY = 0;

    const stiffness = 0.08;   // 弹性（越大越跟手）
    const damping = 0.82;     // 阻尼（越小越快停）

    function animate(){
      // 弹簧力
      const forceX = (targetX - currentX) * stiffness;
      const forceY = (targetY - currentY) * stiffness;

      // 速度叠加
      velocityX = (velocityX + forceX) * damping;
      velocityY = (velocityY + forceY) * damping;

      // 位置更新
      currentX += velocityX;
      currentY += velocityY;

      card.style.transform = `scale(0.85) rotateY(${currentX}deg) rotateX(${currentY}deg)`;

      // 光效也加一点惯性（更真实）
      card.style.setProperty('--mx', (50 + currentX * 2) + '%');
      card.style.setProperty('--my', (50 + currentY * 2) + '%');

      requestAnimationFrame(animate);
    }

    animate();

    document.addEventListener('mousemove',e=>{
      targetX = (window.innerWidth/2 - e.clientX)/60;
      targetY = -(window.innerHeight/2 - e.clientY)/60;
    });

    document.addEventListener('mouseleave',()=>{
      targetX = 0;
      targetY = 0;
    });

    // 壁纸 + 双主题色 + 对比优化
    fetch("https://bing.biturl.top/?resolution=1920&format=json")
      .then(res=>res.json())
      .then(data=>{
        const img=new Image();
        img.crossOrigin="Anonymous";
        img.src=data.url;
        document.body.style.backgroundImage=`url(${data.url})`;

        img.onload=()=>{
          const canvas=document.createElement('canvas');
          const ctx=canvas.getContext('2d');
          canvas.width=60; canvas.height=60;
          ctx.drawImage(img,0,0,60,60);

          let r=0,g=0,b=0,count=0;
          let r2=0,g2=0,b2=0;

          const pixels=ctx.getImageData(0,0,60,60).data;
          for(let i=0;i<pixels.length;i+=4){
            const pr=pixels[i], pg=pixels[i+1], pb=pixels[i+2];
            r+=pr; g+=pg; b+=pb;
            if(i%8===0){ r2+=pr; g2+=pg; b2+=pb; }
            count++;
          }

          r=Math.floor(r/count); g=Math.floor(g/count); b=Math.floor(b/count);
          r2=Math.floor(r2/(count/2)); g2=Math.floor(g2/(count/2)); b2=Math.floor(b2/(count/2));

          document.documentElement.style.setProperty('--accent',`${r},${g},${b}`);
          document.documentElement.style.setProperty('--accent2',`${r2},${g2},${b2}`);

          const brightness=(r*0.299 + g*0.587 + b*0.114);

          if(brightness>160){
            document.documentElement.style.setProperty('--text','#111');
            document.documentElement.style.setProperty('--text-strong','#000');
            document.body.classList.add('light-bg');
          }else{
            document.documentElement.style.setProperty('--text','#f5f5f7');
            document.documentElement.style.setProperty('--text-strong','#ffffff');
            document.body.classList.add('dark-bg');
          }
        };
      });
  </script>
</body>
</html>
