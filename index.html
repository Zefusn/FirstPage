<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人主页</title>
  <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <div class="overlay"></div>

  <main class="container" id="card">
    <section class="hero">
      <div class="avatar">
        <img src="assets/img/avatar.jpg" alt="Zefusn 头像">
      </div>

      <h1 class="name">Zefusn</h1>
      <p class="intro-line">保持热爱，持续生长。</p>

      <div class="daily-quote">
        <div class="quote-label">今日一句</div>
        <div class="quote-text" id="quote-text">加载中...</div>
        <div class="quote-author" id="quote-author"></div>
      </div>
    </section>

    <section class="links-section">
      <div class="links">
        <a class="link-btn" href="https://www.note.luckymax.cn/" target="_blank" rel="noreferrer">
          <span class="link-title">博客</span>
          <span class="link-desc">记录笔记、想法与项目沉淀</span>
        </a>
        <a class="link-btn" href="https://www.snapdrop.luckymax.cn/" target="_blank" rel="noreferrer">
          <span class="link-title">传输</span>
          <span class="link-desc">快速在设备之间分享文件</span>
        </a>
        <a class="link-btn" href="https://www.im.luckymax.cn/" target="_blank" rel="noreferrer">
          <span class="link-title">壁纸</span>
          <span class="link-desc">收藏和切换喜欢的视觉灵感</span>
        </a>
        <a class="link-btn" href="https://www.gd.luckymax.cn/" target="_blank" rel="noreferrer">
          <span class="link-title">基金</span>
          <span class="link-desc">查看理财与数据入口</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="footer">
    © 2026 Zefusn · 保持热爱，无限进步
  </footer>

  <script src="assets/js/script.js"></script>
</body>
</html>
