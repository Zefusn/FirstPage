<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人主页</title>

  <style>
    :root{
      --accent: 200,200,255;
      --accent2: 180,220,255;
      --text: #111;
      --text-soft: rgba(0,0,0,0.65);
      --text-strong: #000;
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif; }

    body {
      min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;
      padding:60px 60px 100px;
      background-size:cover; background-position:center; overflow:hidden;
      animation:fadeIn 1.2s ease;
      perspective:1600px;
    }
    
    .footer {
      position:absolute;
      bottom:30px;
      left:0;
      right:0;
      text-align:center;
      font-size:14px;
      color:rgba(255,255,255,0.8);
      text-shadow:0 1px 2px rgba(0,0,0,0.3);
      opacity:0.8;
    }

    body::before {
      content:""; position:absolute; inset:0;
      background:
        radial-gradient(circle at 20% 30%, rgba(var(--accent),0.35), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(var(--accent2),0.28), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(var(--accent),0.18), transparent 60%);
      filter: blur(110px);
      animation: float 28s ease-in-out infinite alternate;
    }

    body::after {
      content:""; position:absolute; inset:0;
      background-image:url('https://grainy-gradients.vercel.app/noise.svg');
      opacity:0.08;
    }

    @keyframes float {
      from { transform:translateY(-40px) scale(1); }
      to { transform:translateY(40px) scale(1.08); }
    }

    .overlay {
      position:absolute; inset:0;
      backdrop-filter:blur(90px) saturate(160%) brightness(1.08);
      background:rgba(255,255,255,0.16);
    }

    .container {
      position:relative; z-index:2;
      display:flex; flex-direction:column; align-items:center;
      gap:50px;
      padding:85px 100px;
      border-radius:48px;
      width:min(1060px, 92vw);
      min-height:500px;

      backdrop-filter:blur(90px) saturate(200%) brightness(1.1);
      background:linear-gradient(135deg, rgba(255,255,255,0.7), rgba(255,255,255,0.28));

      box-shadow:
        0 80px 200px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.9);

      border:1px solid rgba(255,255,255,0.8);

      transform-style:preserve-3d;
      transition:transform .18s ease-out;
      overflow:hidden;

      transform:scale(0.85);
    }

    .container::after{
      content:""; position:absolute; inset:0; border-radius:inherit;
      background:
        radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.55), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.12), transparent 70%);
      opacity:0.7; pointer-events:none;
    }

    .container::before{
      content:""; position:absolute; inset:0; border-radius:inherit;
      background:linear-gradient(130deg,
        rgba(var(--accent),0.35),
        transparent 30%,
        transparent 70%,
        rgba(var(--accent2),0.35));
      mix-blend-mode:overlay;
      opacity:0.6;
      pointer-events:none;
    }

    .profile { 
      display:flex; flex-direction:column; align-items:center; gap:24px;
      transform: translateZ(40px);
    }

    .avatar {
      width:150px; height:150px; border-radius:50%; overflow:hidden;
      border:3px solid rgba(255,255,255,0.9);
      box-shadow:0 25px 60px rgba(0,0,0,0.22);
      transition:transform .4s ease;
      transform: translateZ(70px);
    }

    .avatar:hover { transform:scale(1.06) translateZ(90px); }

    .avatar img { width:100%; height:100%; object-fit:cover; }

    .name {
      font-size:34px; font-weight:800;
      color:var(--text-strong);
      letter-spacing:0.6px;
      text-shadow:0 2px 10px rgba(0,0,0,0.15);
      transform: translateZ(60px);
    }
    
    .daily-quote {
      text-align:center;
      max-width:600px;
      padding:0 20px;
      transform: translateZ(50px);
    }
    
    .quote-text {
      font-size:16px;
      font-style:italic;
      color:var(--text-soft);
      line-height:1.6;
      margin-bottom:8px;
    }
    
    .quote-author {
      font-size:14px;
      color:var(--text-soft);
      opacity:0.8;
    }

    .links {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
      gap:22px;
      width:100%; max-width:950px;
      transform: translateZ(50px);
    }

    .link-btn {
      display:flex; align-items:center; justify-content:center;
      text-decoration:none;
      padding:20px 26px;
      border-radius:24px;
      color:#0b0b0c;
      font-size:18px; font-weight:800; letter-spacing:0.4px;

      backdrop-filter:blur(24px) saturate(180%);
      background:rgba(255,255,255,0.98);

      box-shadow:0 18px 50px rgba(0,0,0,0.18);
      border:1px solid rgba(0,0,0,0.06);

      position:relative; overflow:hidden;
      text-shadow:0 1px 0 rgba(255,255,255,0.6);

      will-change: transform;

      transition:
        transform .35s cubic-bezier(.2,.9,.25,1.15),
        box-shadow .35s cubic-bezier(.2,.9,.2,1),
        background .25s ease;
    }

    .link-btn::after {
      content:""; position:absolute; inset:0;
      background:linear-gradient(120deg,transparent,rgba(255,255,255,0.9),transparent);
      transform:translateX(-120%);
      transition:0.9s;
    }

    .link-btn:hover::after { transform:translateX(120%); }

    .link-btn:hover {
      transform:translateY(-8px) scale(1.035);
      background:#ffffff;
      box-shadow:0 35px 90px rgba(0,0,0,0.28);
    }

    .link-btn:active {
      transform:translateY(-1px) scale(0.94);
      box-shadow:0 12px 28px rgba(0,0,0,0.18);
      transition: transform .12s cubic-bezier(.3,1.5,.5,1);
    }

    @keyframes fadeIn {
      from {opacity:0; transform:scale(.94);} 
      to {opacity:1; transform:scale(1);} 
    }

    /* ===== 移动端适配（仅新增）===== */
    @media (max-width:768px) {
      body{
        padding:20px;
        perspective:none;
      }

      .container {
        padding:50px 24px;
        border-radius:28px;
        gap:30px;
        transform:scale(1);
      }

      .avatar {
        width:110px; height:110px;
      }

      .name {
        font-size:24px;
      }

      .links {
        grid-template-columns:1fr;
        gap:16px;
      }

      .link-btn {
        padding:18px;
        font-size:16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation:none !important; transition:none !important; }
    }

    .dark-bg .link-btn{
      background:rgba(255,255,255,0.92);
      color:#000;
      border:1px solid rgba(0,0,0,0.08);
      text-shadow:none;
    }

    .light-bg .link-btn{
      background:rgba(255,255,255,0.88);
      color:#000;
    }
  </style>
</head>

<body>
  <div class="overlay"></div>

  <div class="container" id="card">
    <div class="profile">
      <div class="avatar">
        <img src="https://via.placeholder.com/150" alt="avatar">
      </div>
      <div class="name">Zefusn</div>
      <div class="daily-quote">
        <div class="quote-text" id="quote-text">加载中...</div>
        <div class="quote-author" id="quote-author"></div>
      </div>
    </div>

    <div class="links">
      <a class="link-btn" href="#" target="_blank">链接一</a>
      <a class="link-btn" href="#" target="_blank">链接二</a>
      <a class="link-btn" href="#" target="_blank">链接三</a>
    </div>
  </div>

  <!-- 版权信息 -->
  <div class="footer">
    © 2026 Zefusn · 保持热爱，无限进步
  </div>

<script>
const card=document.getElementById('card');

let currentX = 0, currentY = 0;
let velocityX = 0, velocityY = 0;
let targetX = 0, targetY = 0;

const stiffness = 0.08;
const damping = 0.82;

function animate(){
  const forceX = (targetX - currentX) * stiffness;
  const forceY = (targetY - currentY) * stiffness;

  velocityX = (velocityX + forceX) * damping;
  velocityY = (velocityY + forceY) * damping;

  currentX += velocityX;
  currentY += velocityY;

  card.style.transform = `scale(${window.innerWidth<768?1:0.85}) rotateY(${currentX}deg) rotateX(${currentY}deg)`;

  card.style.setProperty('--mx', (50 - currentX * 1.6) + '%');
  card.style.setProperty('--my', (50 - currentY * 1.6) + '%');

  requestAnimationFrame(animate);
}
animate();

document.addEventListener('mousemove',e=>{
  const max = 12;
  targetX = Math.max(-max, Math.min(max, (window.innerWidth/2 - e.clientX)/60));
  targetY = Math.max(-max, Math.min(max, -(window.innerHeight/2 - e.clientY)/60));
});

document.addEventListener('mouseleave',()=>{
  targetX = 0;
  targetY = 0;
});

/* ===== 移动端触摸补充 ===== */
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

if(isMobile){
  document.addEventListener('touchmove',e=>{
    const max = 10;
    targetX = Math.max(-max, Math.min(max, (window.innerWidth/2 - e.touches[0].clientX)/60));
    targetY = Math.max(-max, Math.min(max, -(window.innerHeight/2 - e.touches[0].clientY)/60));
  });

  document.addEventListener('touchend',()=>{
    targetX = 0;
    targetY = 0;
  });
}

/* 背景图 */
fetch("https://bing.biturl.top/?resolution=1920&format=json")
.then(res=>res.json())
.then(data=>{
  const img=new Image();
  img.crossOrigin="Anonymous";
  img.src=data.url;
  document.body.style.backgroundImage=`url(${data.url})`;

  img.onload=()=>{
    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d');
    canvas.width=60; canvas.height=60;
    ctx.drawImage(img,0,0,60,60);

    let r=0,g=0,b=0,count=0;
    let r2=0,g2=0,b2=0;

    const pixels=ctx.getImageData(0,0,60,60).data;
    for(let i=0;i<pixels.length;i+=4){
      const pr=pixels[i], pg=pixels[i+1], pb=pixels[i+2];
      r+=pr; g+=pg; b+=pb;
      if(i%8===0){ r2+=pr; g2+=pg; b2+=pb; }
      count++;
    }

    r=Math.floor(r/count); g=Math.floor(g/count); b=Math.floor(b/count);
    r2=Math.floor(r2/(count/2)); g2=Math.floor(g2/(count/2)); b2=Math.floor(b2/(count/2));

    document.documentElement.style.setProperty('--accent',`${r},${g},${b}`);
    document.documentElement.style.setProperty('--accent2',`${r2},${g2},${b2}`);

    const brightness=(r*0.299 + g*0.587 + b*0.114);

    if(brightness>160){
      document.body.classList.add('light-bg');
    }else{
      document.body.classList.add('dark-bg');
    }
  };
});

/* 每日一句 */
function getDailyQuote() {
  // 备选名言列表，当API调用失败时使用
  const fallbackQuotes = [
    { content: "保持好奇，慢慢变好", author: "未知" },
    { content: "行动是成功的阶梯，行动越多，登得越高", author: "未知" },
    { content: "每一个不曾起舞的日子，都是对生命的辜负", author: "尼采" },
    { content: "生活不是缺少美，而是缺少发现美的眼睛", author: "罗丹" },
    { content: "成功不是终点，失败也不是终结，只有勇气才是永恒", author: "丘吉尔" }
  ];

  // 尝试从API获取名言
  fetch("https://api.quotable.io/random")
  .then(res => {
    if (!res.ok) {
      throw new Error(`HTTP error! status: ${res.status}`);
    }
    return res.json();
  })
  .then(data => {
    console.log('获取名言成功:', data);
    document.getElementById('quote-text').textContent = `"${data.content}"`;
    document.getElementById('quote-author').textContent = `- ${data.author}`;
  })
  .catch(error => {
    console.error('获取每日一句失败:', error);
    // 使用备选名言
    const randomQuote = fallbackQuotes[Math.floor(Math.random() * fallbackQuotes.length)];
    document.getElementById('quote-text').textContent = `"${randomQuote.content}"`;
    document.getElementById('quote-author').textContent = `- ${randomQuote.author}`;
  });
}

// 页面加载完成后获取名言
document.addEventListener('DOMContentLoaded', getDailyQuote);
</script>
</body>
</html>
